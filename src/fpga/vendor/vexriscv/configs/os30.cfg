# VexiiRiscv CPU config — Pocket os30 variant (Quake2 / SM64, 3D triangles).
#
# Sourced by generate_vexii.sh.  Same single-issue base as os25 plus the
# reduced-accuracy FMA (shorter FPU mantissa-compare cone; adopted after the
# 2026-07 equilibrium campaign — best-ever WNS/ALM on both axes).
# Output: VexiiRiscv/VexiiRiscv_os30.v

ICACHE_SETS=256          # 32 KB I$
DCACHE_SETS=1024         # 128 KB D$

EXTRA_FLAGS="--fma-reduced-accuracy"

# Same Pocket-tuned execute_freeze_valid hint as os25.
MAXFAN_HINT=16

# Preserve stalled fetch data with a local registered read selector.
FETCH_READ_HOLD=1

# Register the late aligner capture enable while retaining the buffered PC.
ALIGNER_PC_HOLD=1

# Factor early occupancy terms away from the late dispatch hazard.
FETCH_READY_FACTOR=1

# No Zicbop prefetch.r/w decode — same as os20/os25.  No prefetch hints in
# os.bin, SM64 or Quake2 (2026-09-23 disassembly audit).
LSU_SW_PREFETCH=0

# 2026-09-24 CPU review (tools/experiments/sm64_cpu_20260924/README.md).
# Radix-4 integer/FP divider, as on os25 and MiSTer: fdiv 32 -> 19 cycles,
# divu 36 -> 20.  RTL SM64 vertex-transform kernel -13.1% cycles; the
# display-list kernel is unchanged.
DIV_RADIX=4
# BTB 512 -> 1024 sets (GShare stays 4 KB): fewer SM64 title-scene BTB
# misses in the model; uses 3 of the M10Ks NO_SHIFT_TAPS frees.  GShare 1 KB
# was measured slower on RTL (+1.7% cold display-list kernel) and rejected.
BTB_SETS=1024
# No I$ next-line prefetch: identical cycles on the RTL kernels (cold and
# warm), neutral in the model, about -65 ALM.
FETCH_L1_PREFETCH=none
# Keep FPU/writeback pipeline control flops out of altshift_taps M10Ks
# (synthesis-only, cycle-exact).
NO_SHIFT_TAPS=1
# RELAXED_LEARN=1 (registered predictor update) takes the LSU trap/cancel
# cone off the GShare/BTB RAM write enables but costs +0.5% on the RTL
# display-list kernel with unchanged mispredicts; off until a fit A/B shows
# the timing gain is worth it.
RELAXED_LEARN=0
# fcvt.s.w[u] normalizes in the lane (patch 0003) instead of freezing it for
# the shared unpacker FSM: 16 independent conversions 66 -> 19 cycles, used
# results -19%, identical values (src/fpga/test/cpu_i2f).  SM64 model: a
# further -1.7 ms/frame on the title.
FPU_I2F_PIPELINED=1
# Register the D$ bank write port; reads bypass the pending write, so loads
# and victim reads see identical data (cycle-exact; tools/check_vexii_dcache_writes.py).
# Takes the store hit/redo cone off ~110 bank M10K write enables, os30's worst
# CPU cluster: 40-seed sweep with the render cache, best WNS -1.055 -> -0.806,
# median TNS -479 -> -358.
LSU_WRITE_REG=1
